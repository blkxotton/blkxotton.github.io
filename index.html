<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="BLK XOTTON — a clothing brand built through creativity, identity, and purpose."
  >

  <title>BLK XOTTON™ | Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #080808;
      --soft-black: #111111;
      --white: #f7f7f3;
      --gray: #b7b7b2;
      --border: rgba(255, 255, 255, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at center,
          #1a1a1a 0%,
          var(--black) 62%
        );
      color: var(--white);
      font-family: "Montserrat", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      width: 100%;
      padding: 28px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    /*
      This is the temporary wordmark.

      Later, we will replace this section with the complete
      cotton-ball logo + BLK XOTTON + trademark symbol
      as one properly aligned logo image.
    */

    .brand-lockup {
      display: inline-flex;
      align-items: flex-start;
      position: relative;
    }

    .brand-name {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.16em;
      line-height: 1;
      white-space: nowrap;
    }

    .trademark {
      font-size: 0.48em;
      margin-left: 4px;
      line-height: 1;
      transform: translateY(-2px);
    }

    .status {
      color: var(--gray);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      min-height: calc(100vh - 160px);
      padding: 80px 6%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .hero {
      width: min(950px, 100%);
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: var(--gray);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    h1 {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(3rem, 10vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      margin-bottom: 34px;
    }

    .outlined {
      color: transparent;
      -webkit-text-stroke: 1px var(--white);
      text-stroke: 1px var(--white);
    }

    .message {
      max-width: 650px;
      margin: 0 auto;
      color: var(--gray);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 300;
      line-height: 1.9;
    }

    .divider {
      width: 80px;
      height: 1px;
      background: var(--white);
      margin: 40px auto;
    }

    .coming-soon {
      display: inline-block;
      border: 1px solid var(--white);
      padding: 15px 28px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }

    .background-text {
      position: absolute;
      left: 50%;
      bottom: -6vw;
      transform: translateX(-50%);
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(7rem, 22vw, 22rem);
      line-height: 1;
      color: rgba(255, 255, 255, 0.018);
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    footer {
      padding: 24px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      border-top: 1px solid var(--border);
      color: var(--gray);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 650px) {
      header {
        padding: 22px 5%;
      }

      .status {
        font-size: 0.56rem;
        letter-spacing: 0.12em;
      }

      main {
        padding: 70px 7%;
      }

      h1 {
        line-height: 0.95;
      }

      footer {
        padding: 22px 5%;
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div
        class="brand-lockup"
        aria-label="BLK XOTTON trademark"
      >
        <span class="brand-name">BLK XOTTON</span>
        <sup class="trademark">™</sup>
      </div>

      <p class="status">Est. 2026</p>
    </header>

    <main>
      <section class="hero">

        <p class="eyebrow">
          The first collection is taking shape
        </p>

        <h1>
          Built With<br>
          <span class="outlined">Purpose.</span>
        </h1>

        <p class="message">
          BLK XOTTON is creating something original at the
          intersection of identity, culture, and design.
          Our first collection is currently in development.
        </p>

        <div class="divider"></div>

        <p class="coming-soon">
          Coming Soon
        </p>

      </section>

      <div class="background-text" aria-hidden="true">
        XOTTON
      </div>
    </main>

    <footer>
      <span>BLK XOTTON™</span>
      <span>All Rights Reserved</span>
    </footer>

  </div>
</body>
</html>
